site_name: Research, Rewritten
site_description: Using AI to produce knowledge you can trust. Deep research gives you plausible, this book gives you reliable.
repo_url: https://github.com/hallieren/research-rewritten
site_url: https://hallieren.github.io/research-rewritten/
repo_name: hallieren/research-rewritten
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - footnotes
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hallieren/research-rewritten
      name: GitHub

copyright: Text CC BY-NC-SA 4.0 · Code MIT · Hallie Ren

