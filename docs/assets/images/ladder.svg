<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 340" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .s25{fill:#002FA7;fill-opacity:.25}.s45{fill:#002FA7;fill-opacity:.45}
    .s70{fill:#002FA7;fill-opacity:.70}.s100{fill:#002FA7}
    .onfill{fill:#ffffff}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#ffffff}.ts{fill:#D4D4D2}
      .s25{fill:#2B52C4;fill-opacity:.30}.s45{fill:#2B52C4;fill-opacity:.50}
      .s70{fill:#2B52C4;fill-opacity:.72}.s100{fill:#2B52C4}
    }
  </style>
  <rect class="surface" x="0" y="0" width="1140" height="340"/>
  <text class="tp" x="24" y="38" font-size="17" font-weight="600">The Autonomy Ladder · Four Levels of AI in Research</text>
  <text class="ts" x="24" y="60" font-size="13">Chapter 3 raises this ladder. Every chapter after it marks how high this step climbs today.</text>
  <!-- staircase: step w=264, h grows -->
  <rect class="s25"  x="24"  y="240" width="264" height="60" rx="4"/>
  <rect class="s45"  x="300" y="200" width="264" height="100" rx="4"/>
  <rect class="s70"  x="576" y="160" width="264" height="140" rx="4"/>
  <rect class="s100" x="852" y="120" width="264" height="180" rx="4"/>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <text class="tp" x="156" y="228">1 Tool</text>
    <text class="tp" x="432" y="188">2 Assistant</text>
    <text class="tp" x="708" y="148">3 Collaborator</text>
    <text class="tp" x="984" y="108">4 Autonomous Researcher</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text class="tp" x="156" y="274">You do it, it speeds up one step</text>
    <text class="tp" x="432" y="254">You dispatch, it hands back subtasks</text>
    <text class="onfill" x="708" y="234">It drives a whole stage, you gate it</text>
    <text class="onfill" x="984" y="214">It proposes and executes, you audit</text>
  </g>
</svg>
