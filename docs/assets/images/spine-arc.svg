<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 260" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .curve{stroke:#002FA7;stroke-width:2;fill:none}
    .dot{fill:#002FA7;stroke:#FAFAF8;stroke-width:2}
    @media (prefers-color-scheme: dark){
      .surface{fill:#0A0A0A}.tp{fill:#ffffff}.ts{fill:#D4D4D2}
      .curve{stroke:#2B52C4}.dot{fill:#2B52C4;stroke:#0A0A0A}
    }
  </style>
  <rect class="surface" x="0" y="0" width="1240" height="260"/>
  <text class="tp" x="24" y="38" font-size="17" font-weight="600">The Spine Case Narrative Arc · Can the Small-Model Army Tie the Frontier Model?</text>
  <path class="curve" d="M108 200 C 351 195, 567 160, 756 120 S 1080 70, 1148 62"/>
  <circle class="dot" cx="108"  cy="200" r="6"/>
  <circle class="dot" cx="459" cy="172" r="6"/>
  <circle class="dot" cx="810" cy="108" r="6"/>
  <circle class="dot" cx="1141" cy="63"  r="6"/>
  <g font-size="14" font-weight="600">
    <text class="tp" x="108"  y="230">Doubt</text>
    <text class="tp" x="459" y="150">Verify</text>
    <text class="tp" x="810" y="88">Contribute</text>
    <text class="tp" x="980" y="44">Deliver and take the hits</text>
  </g>
  <g font-size="13">
    <text class="ts" x="108"  y="248">Start Here to Chapter 4. Two camps of papers fight head-on.</text>
    <text class="ts" x="459" y="196">Chapters 5 to 8. Run a plausible claim into evidence.</text>
    <text class="ts" x="760" y="132">Chapter 9. Push a small step where it collapsed or held.</text>
    <text class="ts" x="940" y="177">Chapter 10. Red-teamed, then submitted.</text>
    <text class="ts" x="940" y="196">Filed into the honest map in Chapter 13.</text>
  </g>
</svg>
