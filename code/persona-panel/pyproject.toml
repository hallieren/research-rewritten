[project]
name = "persona-panel"
version = "0.1.0"
description = "LLM persona survey panel vs World Values Survey ground truth"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_panel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
