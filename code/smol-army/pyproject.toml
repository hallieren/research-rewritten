[project]
name = "smol-army"
version = "0.1.0"
description = "Cost-aligned eval harness: small-model teams vs a frontier model"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smol_army"]

[tool.pytest.ini_options]
testpaths = ["tests"]
